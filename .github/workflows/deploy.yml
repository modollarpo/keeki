name: Deploy to Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3️⃣ Install dependencies and build
      - name: Install and build
        run: |
          npm ci
          npm run build

      # 4️⃣ Stage build in azureuser home (no permission issues)
      - name: Stage build for deploy
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: 'public/build'
          target: '/home/azureuser/deploy/'
          overwrite: true

      # 5️⃣ rsync into place, restore ownership, restart PHP-FPM
      - name: Install build + restart PHP-FPM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            sudo rsync -a --delete /home/azureuser/deploy/public/build/ /var/www/bemusic/public/build/
            sudo chown -R www-data:www-data /var/www/bemusic/public/build
            sudo systemctl restart php8.3-fpm
            echo 'Deploy complete'

name: Deploy to Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3️⃣ Install dependencies and build
      - name: Install and build
        run: |
          npm ci
          npm run build

      # 4️⃣ Package PHP source (no node_modules/build artifacts/vcs dirs)
      - name: Package PHP source
        run: |
          mkdir -p release
          tar czf release/php-source.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.azure' \
            --exclude='./node_modules' \
            --exclude='./public/build' \
            --exclude='./storage' \
            --exclude='./vendor' \
            --exclude='./.env' \
            --exclude='./release' \
            .

      # 5️⃣ Stage build in azureuser home (no permission issues)
      - name: Stage build for deploy
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: 'public/build'
          target: '/home/azureuser/deploy/'
          overwrite: true

      # 6️⃣ Stage PHP source tarball
      - name: Stage PHP source
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: 'release/php-source.tar.gz'
          target: '/home/azureuser/deploy/'
          overwrite: true

      # 7️⃣ rsync into place, restore ownership, refresh autoload + caches, restart PHP-FPM
      - name: Install build + PHP source, restart PHP-FPM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            sudo rsync -a --delete /home/azureuser/deploy/public/build/ /var/www/bemusic/public/build/
            mkdir -p /home/azureuser/deploy/php-source
            tar -xzf /home/azureuser/deploy/release/php-source.tar.gz -C /home/azureuser/deploy/php-source --strip-components=1
            sudo rsync -a /home/azureuser/deploy/php-source/ /var/www/bemusic/
            sudo chown -R www-data:www-data /var/www/bemusic
            cd /var/www/bemusic
            sudo -u www-data composer dump-autoload --optimize 2>/dev/null || echo 'composer dump-autoload skipped'
            sudo -u www-data php artisan optimize:clear 2>/dev/null || echo 'optimize:clear skipped'
            # yt-dlp for the direct-stream fallback endpoint (best-effort)
            if [ ! -x /usr/local/bin/yt-dlp ]; then
              sudo curl -sL --retry 3 -o /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp || true
              size=$($(command -v stat) -c %s /usr/local/bin/yt-dlp 2>/dev/null || echo 0)
              if [ "$size" -lt 1000000 ]; then
                echo "yt-dlp download failed (size=$size), removing"
                sudo rm -f /usr/local/bin/yt-dlp
              else
                sudo chmod +x /usr/local/bin/yt-dlp
              fi
            fi
            # Branding + multi-source settings sync (idempotent, no tinker needed)
            sudo mkdir -p /var/www/bemusic/storage/app/public/branding-images
            sudo cp -f /var/www/bemusic/ops/logo-assets/keekii-logo-*.png /var/www/bemusic/storage/app/public/branding-images/ || echo 'branding logo copy skipped'
            sudo chown www-data:www-data /var/www/bemusic/storage/app/public/branding-images/keekii-logo-*.png 2>/dev/null || echo 'branding logo chown skipped'
            # GeoIP: refresh the real GeoLite2-City database so geo detection resolves visitor countries
            if ! grep -q '^MAXMIND_ACCOUNT_ID=' /var/www/bemusic/.env; then
              sudo bash -c "echo 'MAXMIND_ACCOUNT_ID=${{ secrets.MAXMIND_ACCOUNT_ID }}' >> /var/www/bemusic/.env"
            fi
            if ! grep -q '^MAXMIND_LICENSE_KEY=' /var/www/bemusic/.env; then
              sudo bash -c "echo 'MAXMIND_LICENSE_KEY=${{ secrets.MAXMIND_LICENSE_KEY }}' >> /var/www/bemusic/.env"
            fi
            sudo -u www-data -H php /var/www/bemusic/artisan geoip:update || echo 'geoip:update skipped (creds missing or no network)'
            # Seed clearly-labelled demo artists so per-country channels have content,
            # then map them to the geo homepage (idempotent: only seeds empty markets).
            sudo -u www-data -H php /var/www/bemusic/artisan channels:country:seed-demo || echo 'channels:country:seed-demo skipped'
            # Give those artists demo albums/tracks + the localized genres the genre
            # sub-channels look for (idempotent: tops each artist up to the target).
            sudo -u www-data -H php /var/www/bemusic/artisan channels:country:seed-content || echo 'channels:country:seed-content skipped'
            # Derive country for the real (provider-backed) artists from their Wikipedia
            # bios. Must run BEFORE the expand so the hubs pick the mapped artists up in
            # the same deploy. Idempotent and resumable: already-tagged artists are skipped,
            # and only results at or above --min-confidence are written.
            echo '--- music:resolve-artist-countries ---'
            sudo -u www-data -H php /var/www/bemusic/artisan music:resolve-artist-countries --limit=400 --min-confidence=0.9 || echo 'music:resolve-artist-countries skipped'
            # Country channels + geo homepage mapping (idempotent: updateOrCreate by slug, merges existing map)
            sudo -u www-data -H php /var/www/bemusic/artisan channels:country || echo 'channels:country skipped'
            # Expand each country channel into a hub of sub-channels + localized playlists.
            # Runs after channels:country, and falls back to a plain artist grid per market
            # on error so a country page can never end up empty.
            sudo -u www-data -H php /var/www/bemusic/artisan channels:country:expand || echo 'channels:country:expand skipped'
            # Read-only diagnostics: how much of the catalogue is real vs demo, and
            # whether the Wikipedia bios could yield a country per market. Writes nothing.
            echo '--- music:audit-countries ---'
            sudo -u www-data -H php /var/www/bemusic/artisan music:audit-countries || echo 'music:audit-countries skipped'
            sudo -u www-data -H php /var/www/bemusic/ops/sync-settings.php || echo 'settings sync skipped'
            sudo -u www-data php artisan cache:clear 2>/dev/null || echo 'cache:clear skipped'
            sudo systemctl restart php8.3-fpm
            echo 'Deploy complete'

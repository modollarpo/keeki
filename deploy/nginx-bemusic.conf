server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/bemusic/public;
    index index.php;

    charset utf-8;

    # Allow large media uploads (tus / direct upload).
    client_max_body_size 2048m;
    client_body_timeout 600s;

    access_log /var/log/nginx/bemusic.access.log;
    error_log /var/log/nginx/bemusic.error.log;

    # Laravel front controller + SPA fallback.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded media lives in storage/app/public and is symlinked to
    # public/storage (php artisan storage:link).
    location ^~ /storage/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Internal file serving for X-Accel (file preview optimization).
    # Private local files are delivered via X-Accel-Redirect from PHP,
    # which maps to the local uploads disk root (see STATIC_FILE_DELIVERY).
    location /uploads/ {
        internal;
        alias /var/www/bemusic/storage/app/uploads/;
        access_log off;
    }

    # Long-lived cache for compiled front-end assets (public/build).
    location ~* \.(?:js|mjs|css|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|ico|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "upload_max_filesize=2G \n post_max_size=2G \n max_execution_time=600";
        include fastcgi_params;
        fastcgi_read_timeout 600s;
    }

    # Let's Encrypt challenge path.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    # The SPA registers its service worker at /sw.js; vite emits it under /build.
    location = /sw.js {
        alias /var/www/bemusic/public/build/sw.js;
        default_type application/javascript;
        add_header Service-Worker-Allowed /;
    }

    # Deny access to hidden files.
    location ~ /\. {
        deny all;
    }
}
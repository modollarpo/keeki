    <g class="keekii-stem keekii-trail-stem">
      <rect x="49.3" y="19" width="7" height="34" rx="3" fill="#f0864a" />
    </g>
    <g class="keekii-dot keekii-trail-dot">
      <circle cx="52.8" cy="11" r="5" fill="#f0864a" />
    </g>

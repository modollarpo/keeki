    </g>
    <g class="keekii-stem keekii-lead-stem">
      <rect x="36.3" y="31" width="7" height="22" rx="3" fill="#e8611f" />
    </g>
    <g class="keekii-dot keekii-lead-dot">
      <circle cx="39.8" cy="23" r="5" fill="#e8611f" />

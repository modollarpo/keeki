<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="keekii-mark-title">
  <title id="keekii-mark-title">Keekii Twin Pulse mark</title>
  <!--
    Concept B "Twin Pulse": the two "i"s of Keekii read as a pair of pulse
    bars, each topped by a dot. The static "peak-pulse" frame uses one tall bar
    and one short bar.

    Inherits colour from the `color` property, so one file works on the light
    and dark themes. Geometry is shared with the PNG masters.
  -->
  <g fill="currentColor">
    <rect x="232" y="472" width="200" height="400" rx="60" />
    <rect x="592" y="622" width="200" height="250" rx="60" />
    <circle cx="332" cy="267" r="115" />
    <circle cx="692" cy="417" r="115" />
  </g>
</svg>
